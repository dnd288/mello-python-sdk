openapi: 3.1.0
info:
  title: Mello Public API
  version: 1.0.0
  summary: Public REST API for Mello integrations.
  description: >
    The Mello public API is authenticated with personal API tokens and limited to
    the workspaces attached to the token.
servers:
  - url: https://mello.mezon.vn/api/v1
    description: Production through Nginx
security:
  - bearerAuth: [ ]
tags:
  - name: Me
  - name: Workspaces
  - name: Boards
  - name: Columns
  - name: Tickets
  - name: Checklists
  - name: Comments
  - name: History
  - name: Search
  - name: Webhooks
  - name: Github
paths:
  /me:
    get:
      tags: [ Me ]
      summary: Get the API token owner.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspaces:
    get:
      tags: [ Workspaces ]
      summary: List token-accessible workspaces.
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
  /workspaces/{workspaceID}/members:
    get:
      tags: [ Workspaces ]
      summary: List workspace members.
      operationId: listWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceID}/boards:
    get:
      tags: [ Boards ]
      summary: List boards in a workspace.
      operationId: listWorkspaceBoards
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Boards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
    post:
      tags: [ Boards ]
      summary: Create a board.
      operationId: createBoard
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
      responses:
        '201':
          description: Created board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '403':
          $ref: '#/components/responses/Forbidden'
  /boards/{boardID}:
    get:
      tags: [ Boards ]
      summary: Get a board with columns and tickets.
      operationId: getBoard
      parameters:
        - $ref: '#/components/parameters/BoardID'
      responses:
        '200':
          description: Board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
    patch:
      tags: [ Boards ]
      summary: Update board metadata.
      operationId: updateBoard
      parameters:
        - $ref: '#/components/parameters/BoardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardRequest'
      responses:
        '200':
          description: Updated board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
    delete:
      tags: [ Boards ]
      summary: Delete a board.
      operationId: deleteBoard
      parameters:
        - $ref: '#/components/parameters/BoardID'
      responses:
        '204':
          description: Deleted.
  /boards/{boardID}/columns:
    get:
      tags: [ Columns ]
      summary: List board columns.
      operationId: listColumns
      parameters:
        - $ref: '#/components/parameters/BoardID'
      responses:
        '200':
          description: Columns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Column'
    post:
      tags: [ Columns ]
      summary: Create a column.
      operationId: createColumn
      parameters:
        - $ref: '#/components/parameters/BoardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '201':
          description: Created column.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
  /boards/{boardID}/columns/reorder:
    patch:
      tags: [ Columns ]
      summary: Reorder board columns.
      operationId: reorderColumns
      parameters:
        - $ref: '#/components/parameters/BoardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ column_ids ]
              properties:
                column_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '204':
          description: Reordered.
  /boards/{boardID}/tickets:
    get:
      tags: [ Tickets ]
      summary: List tickets on a board.
      operationId: listBoardTickets
      parameters:
        - $ref: '#/components/parameters/BoardID'
      responses:
        '200':
          description: Tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
  /columns/{columnID}:
    patch:
      tags: [ Columns ]
      summary: Update a column.
      operationId: updateColumn
      parameters:
        - $ref: '#/components/parameters/ColumnID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateColumnRequest'
      responses:
        '200':
          description: Updated column.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
  /columns/{columnID}/tickets:
    post:
      tags: [ Tickets ]
      summary: Create a ticket in a column.
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/ColumnID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{ticketID}:
    get:
      tags: [ Tickets ]
      summary: Get a ticket.
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/TicketID'
      responses:
        '200':
          description: Ticket detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
    patch:
      tags: [ Tickets ]
      summary: Update a ticket.
      operationId: updateTicket
      parameters:
        - $ref: '#/components/parameters/TicketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{ticketID}/move:
    patch:
      tags: [ Tickets ]
      summary: Move a ticket atomically.
      operationId: moveTicket
      parameters:
        - $ref: '#/components/parameters/TicketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTicketRequest'
      responses:
        '200':
          description: Move result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveTicketResult'
  /tickets/{ticketID}/checklists:
    post:
      tags: [Checklists]
      summary: Create a checklist on a ticket.
      operationId: createChecklist
      parameters:
        - $ref: '#/components/parameters/TicketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChecklistRequest'
      responses:
        '201':
          description: Created checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /checklists/{checklistID}:
    patch:
      tags: [Checklists]
      summary: Update a checklist.
      operationId: updateChecklist
      parameters:
        - $ref: '#/components/parameters/ChecklistID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistRequest'
      responses:
        '200':
          description: Updated checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Checklists]
      summary: Delete a checklist and its items.
      operationId: deleteChecklist
      parameters:
        - $ref: '#/components/parameters/ChecklistID'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /checklists/{checklistID}/items:
    post:
      tags: [Checklists]
      summary: Create an item in a checklist.
      operationId: createChecklistItem
      parameters:
        - $ref: '#/components/parameters/ChecklistID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChecklistItemRequest'
      responses:
        '201':
          description: Created checklist item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /checklist-items/{itemID}:
    patch:
      tags: [Checklists]
      summary: Update a checklist item.
      operationId: updateChecklistItem
      parameters:
        - $ref: '#/components/parameters/ChecklistItemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItemRequest'
      responses:
        '200':
          description: Updated checklist item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Checklists]
      summary: Delete a checklist item.
      operationId: deleteChecklistItem
      parameters:
        - $ref: '#/components/parameters/ChecklistItemID'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketID}/comments:
    get:
      tags: [ Comments ]
      summary: List ticket comments.
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/TicketID'
      responses:
        '200':
          description: Comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      tags: [ Comments ]
      summary: Add a ticket comment.
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/TicketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Created comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
  /tickets/{ticketID}/history:
    get:
      tags: [ History ]
      summary: List ticket history.
      operationId: listHistory
      parameters:
        - $ref: '#/components/parameters/TicketID'
      responses:
        '200':
          description: History entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
  /search:
    get:
      tags: [ Search ]
      summary: Search tickets in a workspace.
      operationId: searchTickets
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List Webhooks
      operationId: listWebhooks
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks]
      summary: Create a Webhook
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createWebhookRequest'
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createWebhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /webhooks/{webhookID}:
    patch:
      tags: [Webhooks]
      summary: Update a Webhook
      operationId: updateWebhook
      parameters:
        - $ref: '#/components/parameters/WebhookID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                events:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                callback_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Webhooks]
      summary: Delete a Webhook
      operationId: deleteWebhook
      parameters:
        - $ref: '#/components/parameters/WebhookID'
      responses:
        '204':
          description: Webhook deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/{webhookID}/deliveries:
    get:
      tags: [Webhooks]
      summary: List Webhook Deliveries
      operationId: listWebhookDeliveries
      parameters:
        - $ref: '#/components/parameters/WebhookID'
      responses:
        '200':
          description: List of deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/{webhookID}/deliveries/{deliveryID}/redeliver:
    post:
      tags: [Webhooks]
      summary: Redeliver a Webhook event
      operationId: redeliverWebhookEvent
      parameters:
        - $ref: '#/components/parameters/WebhookID'
        - name: deliveryID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Redelivery request accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceID}/github/installations:
    get:
      tags: [ Github ]
      summary: List GitHub installations.
      operationId: listGithubInstallations
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Installations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GithubInstallation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspaces/{workspaceID}/github/repositories:
    get:
      tags: [ Github ]
      summary: List available GitHub repositories.
      operationId: listGithubRepositories
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Repositories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GithubRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspaces/{workspaceID}/boards/{boardID}/github/repositories:
    get:
      tags: [ Github ]
      summary: List GitHub repositories connected to a board.
      operationId: listGithubBoardRepositories
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BoardID'
      responses:
        '200':
          description: Repositories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GithubRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Github ]
      summary: Replace GitHub repositories for a board.
      operationId: replaceGithubBoardRepositories
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BoardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ repositories ]
              properties:
                repositories:
                  type: array
                  items:
                    type: object
                    required: [ installation_id, github_repo_id ]
                    properties:
                      installation_id:
                        type: integer
                      github_repo_id:
                        type: integer
      responses:
        '200':
          description: Replaced repositories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GithubRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspaces/{workspaceID}/github/connect/start:
    post:
      tags: [ Github ]
      summary: Start GitHub App installation.
      operationId: startGithubConnect
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replace:
                  type: boolean
                board_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_url:
                    type: string
                  state:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspaces/{workspaceID}/github/installations/{installationID}:
    delete:
      tags: [ Github ]
      summary: Delete GitHub installation.
      operationId: deleteGithubInstallation
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - name: installationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets/{ticketID}/github/search:
    get:
      tags: [ Github ]
      summary: Search GitHub objects for a ticket.
      operationId: searchGithubObjects
      parameters:
        - $ref: '#/components/parameters/TicketID'
        - name: q
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [issue, pull_request, branch, commit]
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GithubSearchObjectResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets/{ticketID}/github/links:
    post:
      tags: [ Github ]
      summary: Link a GitHub object to a ticket.
      operationId: createGithubLink
      parameters:
        - $ref: '#/components/parameters/TicketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubCreateLinkRequest'
      responses:
        '201':
          description: Created link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets/{ticketID}/github/links/{linkID}:
    delete:
      tags: [ Github ]
      summary: Unlink a GitHub object from a ticket.
      operationId: deleteGithubLink
      parameters:
        - $ref: '#/components/parameters/TicketID'
        - name: linkID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Mello API token
  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BoardID:
      name: boardID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ColumnID:
      name: columnID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticketID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookID:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChecklistID:
      name: checklistID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChecklistItemID:
      name: itemID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Request parameters or body are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Token cannot access the resource or lacks scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request body or validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
