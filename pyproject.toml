[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mello-sdk"
version = "1.0.0"
description = "Typed Python SDK for the Mello Public REST API"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mello Integration Team" },
]
keywords = ["mello", "sdk", "api", "kanban", "tickets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25.0",
]

[project.scripts]
mello-mcp-server = "mello.mcp_server:main"

[project.urls]
Homepage = "https://mello.mezon.vn"
Documentation = "https://mello.mezon.vn/api/v1"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=6.0.0",
    "responses>=0.13.0",
    "black>=22.0.0",
    "flake8>=3.9.0",
    "mypy>=0.900",
    "types-requests",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[tool.setuptools.package-data]
mello = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: live Mello API tests that require MELLO_API_KEY and create/delete remote data",
]
